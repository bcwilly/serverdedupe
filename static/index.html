<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServerDedupe</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f42;--text:#e6e8ef;--mute:#8b91a7;
--accent:#6366f1;--accent2:#818cf8;--danger:#f43f5e;--ok:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:24px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top{position:sticky;top:0;z-index:5}
#banner{background:var(--panel2);border-bottom:2px solid var(--accent);padding:10px 20px}
#banner .in{max-width:1200px;margin:0 auto}
#banner .top-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#banner .top-row b{font-size:14px}
#banner .bar{margin:8px 0 4px}
#banner .cur{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
#banner .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
#banner .stats b{color:var(--text);font-size:12px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
header h1{font-size:16px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent2)}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--panel2);color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;white-space:nowrap}
button.btn:hover{border-color:var(--accent2)}
button.primary{background:var(--accent);border-color:var(--accent)}
button.primary:hover{background:var(--accent2)}
button.danger{background:var(--danger);border-color:var(--danger)}
button.danger:hover{filter:brightness(1.1)}
button.btn:disabled{opacity:.45;cursor:default}
button.sm{padding:3px 9px;font-size:12px}
.loc{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.loc .p{flex:1;word-break:break-all}
.loc label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);white-space:nowrap}
.empty{color:var(--mute);padding:14px;text-align:center}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.mute{color:var(--mute)}.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.chip b{display:block;font-size:18px}
.chip.sel b{color:var(--accent2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto}
.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.ghead{padding:8px 14px;background:var(--panel2);display:flex;gap:14px;align-items:center;font-size:12px;color:var(--mute)}
.ghead b{color:var(--text)}
.f{display:grid;grid-template-columns:28px 56px minmax(0,1fr) 90px 160px 170px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.f.sel{background:rgba(244,63,94,.09)}
.f .nm{overflow:hidden}
.f .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .nm span{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.f img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--bg);cursor:zoom-in;display:block}
.f .ph{width:48px;height:48px}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.prot{color:var(--ok);border-color:var(--ok)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
.modal.img>div{max-width:92vw;width:auto;padding:8px}
.modal.img img{max-width:88vw;max-height:80vh;display:block}
.dirs button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:7px 8px;border-radius:6px;cursor:pointer;font:inherit}
.dirs button:hover{background:var(--panel2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:10px 18px;border-radius:10px;z-index:30;max-width:90vw}
.errs{max-height:200px;overflow:auto;font-size:12px;color:var(--warn);white-space:pre-wrap;word-break:break-all}
.hide{display:none!important}
#mmenu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px #000a;padding:8px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto}
#mmenu .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
#mmenu h4{margin:4px 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#mmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
#mmenu button:hover{background:var(--panel2)}
#mmenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#mmenu .ctx{padding:2px 8px 6px;font-size:12px;color:var(--mute);word-break:break-all}
a.btn{display:inline-block;text-decoration:none;color:var(--text)}
.f .nm b.link{cursor:pointer}.f .nm b.link:hover{color:var(--accent2);text-decoration:underline}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all;user-select:all;margin:4px 0 10px}
.warnbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#3a2a12;border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--danger);border-color:var(--danger)}.pill.warn{color:var(--warn);border-color:var(--warn)}
td .sub{display:block;font-size:12px;color:var(--mute)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:10px 6px;cursor:pointer;font:inherit;text-align:center}
.tabs button b{display:block;color:var(--text);font-weight:600}
.tabs button span{font-size:11px}
.tabs button.on{border-color:var(--accent);background:rgba(99,102,241,.14)}
.tabs button.on span{color:var(--accent2)}
.f .nm .meta{color:var(--accent2);direction:ltr;font-size:12px}
.f .play{width:48px;height:48px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--accent2);font-size:20px;cursor:pointer}
.f .thumbwrap{position:relative;width:48px;height:48px}
.f .thumbwrap i{position:absolute;inset:auto 2px 2px auto;font-style:normal;font-size:10px;background:rgba(0,0,0,.7);border-radius:4px;padding:0 4px}
.viewer>div{max-width:96vw;width:auto;min-width:min(640px,92vw);max-height:97vh;padding:10px 14px;text-align:center;overflow:hidden}
.viewer .vmedia{overflow:auto;max-height:calc(100vh - 270px);border-radius:6px;display:flex;justify-content:center}
.viewer .vmedia.zoom{justify-content:flex-start;cursor:zoom-out}
.viewer .vhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:8px;text-align:left}
.viewer .vname{font-weight:600;word-break:break-all}.viewer .vpath{font-size:12px;color:var(--mute);word-break:break-all}
.viewer .vstate{padding:3px 12px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.viewer .vstate.on{background:#4a1d2a;border-color:var(--danger);color:#ffb3c0}.viewer .vstate.prot{border-color:var(--ok);color:var(--ok)}
.viewer .vbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.viewer .vrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.viewer .vrow+.vrow{margin-top:6px}
.viewer .vgrid{display:grid;gap:10px;overflow:auto;max-height:calc(100vh - 215px);padding:2px;text-align:left}
.viewer .vtile{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:5px;min-width:0}
.viewer .vtile.on{border-color:var(--danger);background:#2a1219}
.viewer .vtile.prot{border-color:var(--ok)}
.viewer .vtile .vimg{height:var(--th,220px);display:flex;align-items:center;justify-content:center;cursor:zoom-in;position:relative}
.viewer .vtile .vimg img{max-width:100%;max-height:100%;width:auto;height:auto;cursor:zoom-in}
.viewer .vtile .num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.viewer .vtile .tn{font-weight:600;font-size:13px;word-break:break-all}
.viewer .vtile .tp{font-size:11px;color:var(--mute);word-break:break-all;max-height:2.6em;overflow:hidden}
.viewer .vtile .ti{font-size:12px}
.viewer .vtile .tb{display:flex;gap:6px;margin-top:auto}
.viewer .vtile .tb .btn{flex:1}
.viewer .best{color:var(--ok);font-size:11px;margin-left:6px}
.viewer .vhint{font-size:11px;color:var(--mute);margin-top:8px}
.viewer img,.viewer video{max-width:92vw;max-height:calc(100vh - 270px);display:block;margin:0 auto;border-radius:6px;cursor:zoom-in;object-fit:contain}
.viewer video{cursor:auto}
.viewer .vmedia.zoom img{max-width:none;max-height:none;margin:0;cursor:zoom-out}
.modal video,.modal audio{max-width:88vw;max-height:78vh;display:block}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
</style>
</head>
<body>
<div class="top">
<header>
  <h1>Server<span>Dedupe</span> <small id="ver" style="font-size:11px;font-weight:400;color:var(--mute)"></small></h1>
  <nav id="nav"></nav>
</header>
<div id="banner" class="hide"></div>
</div>
<main id="main"></main>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
function el(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v===true?'':v);
  }
  for (const k of kids.flat()) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
async function api(url, body, method){
  const o = {headers:{'Content-Type':'application/json'}};
  if (body!==undefined){ o.method = method||'POST'; o.body = JSON.stringify(body); } else if (method) o.method = method;
  busyUp();
  try{
    const r = await fetch(url, o);
    const j = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  } finally { busyDown(); }
}
// "Working…" strip: shows when a request takes more than a second, so a big scan on a slow NAS never looks frozen
let _busy = 0, _busyTimer = null, _busyStart = 0;
function busyUp(){
  if(_busy++) return;
  _busyStart = Date.now();
  _busyTimer = setTimeout(() => {
    let b = document.getElementById('working');
    if(!b){ b = document.createElement('div'); b.id = 'working';
      b.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:80;background:#2a2f55;border:1px solid #6c6cff;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px #0008';
      document.body.append(b); }
    const tick = () => { b.textContent = `⏳ Working… ${Math.round((Date.now()-_busyStart)/1000)}s (large scans take a while on the NAS)`; };
    tick(); b._iv = setInterval(tick, 1000);
  }, 1000);
}
function busyDown(){
  if(--_busy) return;
  clearTimeout(_busyTimer);
  const b = document.getElementById('working'); if(b){ clearInterval(b._iv); b.remove(); }
}
const fmtSize = n => { if(n==null) return ''; const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<4){n/=1024;i++} return (i?n.toFixed(n<10?2:1):n)+' '+u[i]; };
const fmtDate = t => new Date(t*1000).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
function toast(msg, ms=4000){ const t=el('div',{class:'toast'},msg); document.body.append(t); setTimeout(()=>t.remove(), ms); }
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} } };

const S = { cfg:null, tab:'scan', editJob:null, rootsBackup:null, roots:store.get('roots',[]), scanId:store.get('scanId',null), loaded:0, sum:null, poll:null };
const TABS = [['scan','Scan'],['jobs','Schedule'],['results','Results'],['trash','Quarantine'],['history','History']];

function renderNav(){
  const n = $('#nav'); n.replaceChildren(...TABS.map(([k,l]) => el('button',{class:S.tab===k?'on':'',onclick:()=>go(k)},l)));
}
function go(tab){ S.tab=tab; S.refresh=null; renderNav(); ({scan:viewScan,jobs:viewJobs,results:viewResults,trash:viewTrash,history:viewHistory})[tab](); }

/* ---------- folder picker ---------- */
function pickFolder(title, cb, multi=false){
  const body = el('div',{class:'dirs'});
  const head = el('div',{class:'row',style:'margin-bottom:8px'});
  const picked = new Set();
  const sel = el('button',{class:'btn primary',style:'flex:none'}, multi ? 'Add this folder' : 'Use this folder');
  const addTicked = multi ? el('button',{class:'btn primary',style:'flex:none'},'Add ticked folders') : null;
  const allBtn = multi ? el('button',{class:'btn sm',style:'flex:none'},'Tick all') : null;
  const m = el('div',{class:'modal'}, el('div',{}, el('h2',{style:'margin-top:0'},title), head, allBtn ? el('div',{style:'margin-bottom:6px'},allBtn) : '', body,
      el('div',{class:'row',style:'margin-top:12px;justify-content:flex-end'}, el('button',{class:'btn',style:'flex:none',onclick:()=>m.remove()},'Cancel'), addTicked||'', sel)));
  document.body.append(m);
  let cur = null, curDirs = [];
  async function load(p){
    try{
      const d = await api('/api/browse'+(p?'?path='+encodeURIComponent(p):''));
      cur = d.path; curDirs = d.dirs.map(n => d.path+'/'+n);
      head.replaceChildren(el('div',{class:'mute small',style:'word-break:break-all'},d.path),
        d.parent ? el('button',{class:'btn sm',style:'flex:none',onclick:()=>load(d.parent)},'↑ Up') : '');
      body.replaceChildren(...(d.dirs.length ? d.dirs.map(n => { const full = d.path+'/'+n;
        return el('div',{style:'display:flex;align-items:center;gap:8px'},
          multi ? el('input',{type:'checkbox',checked:picked.has(full),onchange:e=>e.target.checked?picked.add(full):picked.delete(full)}) : '',
          el('button',{onclick:()=>load(full)},'📁 '+n)); }) : [el('div',{class:'empty'},'No sub-folders')]));
    }catch(e){ toast(e.message) }
  }
  if(allBtn) allBtn.onclick = () => { curDirs.forEach(x=>picked.add(x)); body.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=true); };
  if(addTicked) addTicked.onclick = () => { if(!picked.size) return toast('Tick some folders first'); m.remove(); cb([...picked]); };
  sel.onclick = () => { if(cur){ m.remove(); cb(multi ? [cur] : cur); } };
  load(null);
}

/* ---------- scan tab ---------- */
const FAMILIES = [['regular','Regular','Any file type'],['photo','Photo','Pictures'],['video','Video','Movies & clips'],['audio','Audio','Music & recordings'],['folders','Empty folders','Tidy up'],['health','Health check','Find damaged files'],['large','Large files','Find the biggest']];
const METHOD_LABELS = {
  content:'Exact content (SHA-256) — identical files', name:'Same file name', name_size:'Same file name and size',
  image:'Similar images (visual match — ignores size, format, resave)',
  video_duration:'Same length (weak: many false matches — review carefully)',
  video_similar:'Similar video (frame match — ignores resolution, format, bitrate)',
  audio_tags:'Same artist + title tags', audio_tags_dur:'Same artist + title tags and similar length',
  audio_fp:'Same recording (audio fingerprint — ignores tags, bitrate, format)',
  empty:'Empty folders', video_health:'Videos — damaged, cut off or blank', large_files:'Biggest files (no matching)'};
const FAMILY_HINT = {regular:'Scans every file type.', photo:'Only picture files (jpg, png, heic, raw …) unless you list extensions.',
  video:'Only video files (mp4, mkv, mov, avi …) unless you list extensions.', audio:'Only audio files (mp3, flac, m4a, ogg, wav …) unless you list extensions.',
  health:'Finds videos that are cut off, unreadable or have a long blank (black) stretch. Nothing is changed until you choose to. Photos will be added later.',
  large:'Lists the biggest files in the folders you pick, biggest first, so you can see where the space went. Then remove, move or compress them (7z or zip). No duplicate matching.',
  folders:'Finds folders with nothing in them (including folders that only hold other empty folders). Nothing is removed until you choose to.'};
const FAMILY_MIN_KB = {regular:1, photo:10, video:1024, audio:100, folders:0, health:50, large:102400};
const methodLabel = (fam, m) => fam==='large' ? 'Large files' : fam==='folders' ? 'Empty folders' : fam==='health' ? 'Health check: videos' : (fam && fam!=='regular' ? FAMILIES.find(x=>x[0]===fam)[1]+': ' : '') + (METHOD_LABELS[m]||m).split(' — ')[0].split(' (')[0];

function viewScan(){
  const m = $('#main');
  const s = Object.assign({family:'regular',mode:'content',min_kb:1,max_mb:'',include_ext:'',exclude_ext:'',exclude_dirs:S.cfg.default_excludes,threshold:4,dur_tol:2,vthreshold:10,ber:30,include_album:false,flips:false,blank_secs:45,deep:false,health_mode:'quick',junk:true,auto_remove:false,top_n:500}, S.editJob ? S.editJob.params : store.get('settings',{}));
  if(!S.cfg.methods[s.family] || !S.cfg.methods[s.family].includes(s.mode)){ s.family='regular'; s.mode='content'; }
  const roots = el('div');
  const draw = () => {
    roots.replaceChildren(...(S.roots.length ? S.roots.map((r,i) => el('div',{class:'loc'},
      el('div',{class:'p'},r.path),
      el('label',{title:'Files here are never selected for removal. Use it for the copy you want to keep.'}, el('input',{type:'checkbox',checked:r.protected,onchange:e=>{r.protected=e.target.checked;store.set('roots',S.roots)}}),'Protected'),
      el('button',{class:'btn sm',onclick:()=>{S.roots.splice(i,1);store.set('roots',S.roots);draw()}},'Remove'))) : [el('div',{class:'empty'},'No folders yet — add one to scan.')]));
  };
  draw();
  const f = {};
  const inp = (k,type='text',ph='') => (f[k] = el('input',{type,value:settingsVal(s,k),placeholder:ph}));
  const tabs = el('div',{class:'tabs'});
  const mode = el('select',{});
  const hint = el('div',{class:'mute small',style:'margin-top:6px'});
  const slider = (key,min,max,txt) => { const r = f[key] = el('input',{type:'range',min,max,value:s[key]}); const l = el('span',{class:'mute small'});
    const upd = () => l.textContent = txt(r.value); r.oninput = upd; upd(); return el('div',{}, r, l); };
  const num = (key,label) => el('div',{}, el('label',{},label), f[key] = el('input',{type:'number',min:0,max:60,step:0.5,value:s[key]}));
  const imgBox = el('div',{}, el('label',{},'Image similarity'), slider('threshold',0,12,v=>`Strictness: ${v} (0 = near-identical, 12 = very loose)`));
  const durBox = el('div',{}, num('dur_tol','Lengths may differ by up to (seconds)'));
  const vidBox = el('div',{}, el('label',{},'Video similarity'), slider('vthreshold',0,24,v=>`Frame difference allowed: ${v} (lower = stricter)`));
  const audBox = el('div',{}, el('label',{},'Audio similarity'), slider('ber',10,40,v=>`Fingerprint difference allowed: ${v}% (lower = stricter; different songs are ~47%)`));

function fmtEta(sec){
  if(!isFinite(sec) || sec<0) return '—';
  sec = Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), x=sec%60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${x}s` : `${x}s`;
}
function updateBanner(r, now){
  const b = $('#banner');
  if(!r){ b.classList.add('hide'); b.replaceChildren(); return; }
  b.classList.remove('hide');
  const total = r.total||0, done = r.done||0, known = total>0;
  const pct = known ? Math.min(100, done*100/total) : 0;
  const elapsed = r.phase_start ? Math.max(0, now - r.phase_start) : 0;
  const rate = elapsed>2 && done>0 ? done/elapsed : 0;               // items per second
  const eta = known && rate && total>done ? (total-done)/rate : null;
  const first = (r.params.roots||[]).map(x=>x.path.split('/').pop()).join(', ');
  const stat = (k,v) => el('span',{}, k+' ', el('b',{},v));
  b.replaceChildren(el('div',{class:'in'},
    el('div',{class:'top-row'}, el('span',{class:'pulse'}), el('b',{}, 'Scan #'+r.id+' · '+(r.phase||'starting')),
      el('span',{class:'mute small'}, (r.job_name?'⏰ '+r.job_name+' · ':'')+methodLabel(r.params.family, r.mode)+(first?' · '+first:'')),
      el('span',{style:'flex:1'}),
      el('button',{class:'btn sm',onclick:()=>api('/api/scans/'+r.id+'/cancel',{})},'Cancel scan')),
    el('div',{class:'bar'}, el('div',{style:`width:${known?pct.toFixed(1):100}%;${known?'':'opacity:.25'}`})),
    el('div',{class:'stats'},
      known ? stat('Progress', `${done.toLocaleString()} of ${total.toLocaleString()} (${pct.toFixed(1)}%)`) : stat('Found so far', done.toLocaleString()),
      known ? stat('Time left', eta==null ? 'calculating…' : '≈ '+fmtEta(eta)) : '',
      rate ? stat('Speed', rate>=1 ? rate.toFixed(1)+' files/s' : (rate*60).toFixed(1)+' files/min') : '',
      stat('This step', fmtEta(elapsed)+' elapsed')),
    r.message ? el('div',{class:'cur',title:r.message}, '\u200E'+r.message) : ''));
}
async function pollOnce(){
  const st = await api('/api/status').catch(()=>null);
  if(!st) return true;
  updateBanner(st.running, st.now);
  return !!st.running;
}
function startPolling(){
  if(S.poll) return;
  pollOnce();
  S.poll = setInterval(async () => {
    const still = await pollOnce();
    if(!still){
      clearInterval(S.poll); S.poll=null;
      const {scans} = await api('/api/scans');
      const last = scans[0];
      if(last){
        if(last.status==='done'){ S.scanId=last.id; store.set('scanId',last.id); toast(last.params.family==='large' ? `Large files scan finished: the ${last.stats.groups} biggest files are listed` : last.params.family==='health' ? `Health check finished: ${last.stats.groups} damaged or suspect video${last.stats.groups===1?'':'s'} found in ${last.stats.files} checked` : last.params.family==='folders' ? `Scan finished: ${last.stats.groups} empty folders found`+(last.stats.removed?`, ${last.stats.removed} deleted automatically`:'') : `Scan finished: ${last.stats.groups} duplicate groups`, 6000); go('results'); }
        else if(last.status==='error') toast('Scan failed: '+last.message, 10000);
        else if(last.status==='cancelled') toast('Scan cancelled');
        else if(last.status==='interrupted') toast('Scan was interrupted (the container restarted)', 8000);
      }
    }
  }, 1000);
}

  async function doAct(action){
    if(!S.sum || !S.sum.selected_files){ toast('Nothing selected'); return; }
    const n = `${S.sum.selected_files.toLocaleString()} files (${fmtSize(S.sum.selected_bytes)})`;
    const allG = S.sum.all_selected_groups || 0;
    let allowAll = false;
    if(allG && action==='move') allowAll = true;   // moving keeps every file, so no typed confirmation
    else if(allG && action!=='hardlink'){
      const c = await choose(`${allG.toLocaleString()} group${allG>1?'s have':' has'} every copy ticked`,
        `Going ahead would remove ALL copies of those files${action==='trash'?' (you could still restore them from Quarantine)':''}. What would you like to do?`,
        [['show','Show me these groups','primary'],['fix','Keep one copy in each'],['all','Remove all copies anyway','danger'],['no','Cancel']]);
      if(c==='show'){ pageAll=true; drawSummary(); loadGroups(true); return; }
      if(c==='fix'){ await fixAll(); return; }
      if(c!=='all') return;
      if(prompt('Type REMOVE ALL to include them.')!=='REMOVE ALL') return;
      allowAll = true;
    }
    const doIt = async dest => {
      try{
        const r = await api('/api/scans/'+S.scanId+'/act',{action,dest,allow_all:allowAll});
        S.sum = r.summary; drawSummary(); loadGroups(true,true);
        toast(`${r.done} done (${fmtSize(r.bytes)}), ${r.skipped} skipped`, 6000);
        if(r.errors.length) showErrors(r.errors);
      }catch(e){ toast(e.message, 8000) }
    };
    if(action==='trash'){ if(confirm(`Move ${n} to the quarantine folder?\nYou can restore them from the Quarantine tab.`)) doIt(); }
    else if(action==='hardlink'){ if(confirm(`Replace ${n} with hardlinks to a kept copy?\nSpace is reclaimed, and the files stay visible in every folder. Only works within one shared folder.`)) doIt(); }
    else if(action==='move'){ pickFolder('Move selected files to…', p => { if(confirm(`Move ${n} to\n${p}?`)) doIt(p); }); }
    else if(action==='delete'){ if(prompt(`PERMANENTLY delete ${n}? This cannot be undone.\nType DELETE to confirm.`)==='DELETE') doIt(); }

  await loadGroups(true);

     el('div',{style:'text-align:right;margin-top:10px'}, el('button',{class:'btn',onclick:()=>m.remove()},'Close'))));
  document.body.append(m);
}

/* ---------- quarantine ---------- */
async function viewTrash(){
  const m = $('#main'); const d = await api('/api/trash');
  const checks = new Set();
  const tb = el('tbody');
  d.items.forEach(i => tb.append(el('tr',{},
    el('td',{},el('input',{type:'checkbox',onchange:e=>e.target.checked?checks.add(i.id):checks.delete(i.id)})),
    el('td',{style:'word-break:break-all'},i.orig_path), el('td',{},fmtSize(i.size)), el('td',{class:'mute'},fmtDate(i.ts)))));
  const run = async (url, body, msg) => { const r = await api(url, body); toast(`${r.done} ${msg}`+(r.errors.length?`, ${r.errors.length} problems`:'')); if(r.errors.length) showErrors(r.errors); viewTrash(); };
  m.replaceChildren(el('div',{class:'card'}, el('h2',{},`Quarantine — ${d.count.toLocaleString()} files, ${fmtSize(d.bytes)}`),
    el('p',{class:'mute small'},'Removed duplicates wait here (a hidden “'+S.cfg.trash_name+'” folder inside each shared folder) until you empty it. Restore puts a file back where it came from.'),
    el('div',{class:'toolbar'},
      el('button',{class:'btn',onclick:()=>checks.size?run('/api/trash/restore',{ids:[...checks]},'restored'):toast('Tick some files first')},'Restore selected'),
      el('button',{class:'btn',onclick:()=>{ if(!checks.size) return toast('Tick some files first'); if(confirm(`Permanently delete ${checks.size} files?`)) run('/api/trash/purge',{ids:[...checks]},'deleted'); }},'Delete selected forever'),
      el('button',{class:'btn danger',onclick:()=>{ if(d.count && confirm(`Permanently delete ALL ${d.count} quarantined files (${fmtSize(d.bytes)})?`)) run('/api/trash/purge',{all:true},'deleted'); }},'Empty quarantine')),
    d.items.length ? el('table',{}, el('thead',{},el('tr',{},el('th',{}),el('th',{},'Original location'),el('th',{},'Size'),el('th',{},'Removed'))), tb) : el('div',{class:'empty'},'Quarantine is empty.')));
}

/* ---------- history ---------- */
async function viewHistory(){
  const {scans} = await api('/api/scans'); const m = $('#main');
  const tb = el('tbody');
  const stat = s => el('td',{}, el('span',{class:'pill '+(s.status==='done'?'ok':s.status==='error'?'bad':'warn')}, s.status), s.message ? el('span',{class:'sub',title:s.message}, s.message.slice(0,70)) : '');
  scans.forEach(s => tb.append(el('tr',{},
    el('td',{},'#'+s.id), el('td',{},(s.source==='schedule'?'⏰ ':'')+fmtDate(s.started), el('span',{class:'sub'}, s.job_name ? 'Job: '+s.job_name : s.job_id ? 'Job (deleted)' : 'Manual scan')),
    el('td',{},methodLabel(s.params.family, s.mode)),
    el('td',{style:'word-break:break-all'},(s.params.roots||[]).map(r=>r.path).join(', ')), stat(s), el('td',{},s.stats.groups!=null?s.stats.groups.toLocaleString():''),
    el('td',{}, el('div',{class:'actions'}, s.status==='done'?el('button',{class:'btn sm',onclick:()=>{S.scanId=s.id;store.set('scanId',s.id);go('results')}},'Open'):'',
      el('button',{class:'btn sm',onclick:async()=>{ if(!confirm('Delete scan #'+s.id+' results? (No files are touched.)')) return; try{ await api('/api/scans/'+s.id,undefined,'DELETE'); if(S.scanId===s.id){S.scanId=null} viewHistory(); }catch(e){toast(e.message)} }},'Delete'))))));
  const days = el('input',{type:'number',min:0,max:3650,value:7,style:'width:80px'});
  const ci = await api('/api/cache').catch(()=>null);
  const cdays = el('input',{type:'number',min:0,max:3650,value:ci?ci.days:30,style:'width:80px'});
  const cacheCard = ci ? el('div',{class:'card'}, el('h2',{},'Speed-up cache'),
    el('p',{class:'mute small'}, `${ci.entries.toLocaleString()} files remembered. Scans reuse this so unchanged files are not read again. Entries for files not seen in any scan for ${ci.days} days are removed automatically after each scan; files waiting in the quarantine are kept.`),
    el('div',{class:'toolbar'}, 'Forget files not seen for', cdays, 'days',
      el('button',{class:'btn',onclick:async()=>{ if(!confirm(`Forget cached details of files not seen in ${cdays.value} days? Your files are not touched; those files are simply read again if they come back.`)) return;
        try{ const r=await api('/api/cache/clean',{days:+cdays.value}); toast(r.removed.toLocaleString()+' entries removed'); viewHistory(); }catch(e){toast(e.message)} }},'Clean cache now'))) : '';
  const ign = await api('/api/ignores').catch(()=>({items:[]}));
  const scopeSel = el('select',{style:'width:auto'}, el('option',{value:'all'},'Empty-folder scans and duplicate/health scans'), el('option',{value:'empty'},'Empty-folder scans only (keep it empty)'), el('option',{value:'scan'},'Duplicate and health scans only (skip it)'));
  const SCOPE = {all:'all scans', empty:'empty-folder scans', scan:'duplicate & health scans'};
  const ignRows = ign.items.map(i => el('tr',{},
    el('td',{}, i.kind==='folder' ? 'Folder' : 'Duplicate group'),
    el('td',{style:'word-break:break-all'}, i.kind==='folder' ? i.path : el('span',{title:i.paths.join('\n')}, i.paths.map(p=>p.split('/').pop()).slice(0,3).join('  +  ')+(i.paths.length>3?`  (+${i.paths.length-3} more)`:'')+`  · ${i.paths.length} files`)),
    el('td',{}, i.kind==='folder' ? SCOPE[i.scope] : 'duplicate scans'),
    el('td',{}, fmtDate(i.created)),
    el('td',{}, el('button',{class:'btn sm',onclick:async()=>{ try{ await api('/api/ignores/'+i.id+'/delete',{}); viewHistory(); }catch(e){ toast(e.message) } }},'Remove'))));
  const ignoreCard = el('div',{class:'card'}, el('h2',{},'Ignore list'),
    el('p',{class:'mute small'},'Folders and duplicate groups you chose to ignore permanently. This applies to every scan, including scheduled jobs. A folder on the list is skipped (or kept, for empty-folder scans); a duplicate group on the list is hidden as long as it is made only of the same files. Remove an entry to bring it back at the next scan.'),
    el('div',{class:'toolbar'}, scopeSel, el('button',{class:'btn',onclick:()=>pickFolder('Ignore this folder', async p => { try{ await api('/api/ignores',{path:p,scope:scopeSel.value}); viewHistory(); toast('Added to the ignore list'); }catch(e){ toast(e.message) } })},'Add a folder…')),
    ign.items.length ? el('table',{}, el('thead',{},el('tr',{},...['Type','What','Applies to','Added',''].map(h=>el('th',{},h)))), el('tbody',{},...ignRows)) : el('div',{class:'empty'},'Nothing ignored yet. Use “Ignore” on a duplicate group or an empty folder, or the right-click menu on a file.'));
  m.replaceChildren(ignoreCard, cacheCard, el('div',{class:'card'}, el('h2',{},'Scan history'),
    el('div',{class:'toolbar'}, el('span',{class:'mute small'},'Clean up saved results (no files are touched):'), 'Older than', days, 'days',
      el('button',{class:'btn',onclick:async()=>{ if(!confirm(`Delete all saved scan results older than ${days.value} days?`)) return; try{ const r=await api('/api/scans/cleanup',{older_than_days:+days.value}); toast(r.deleted+' old scans removed'); viewHistory(); }catch(e){toast(e.message)} }},'Delete old results')),
    scans.length ? el('table',{}, el('thead',{},el('tr',{},...['Scan','Started','Match','Folders','Status','Groups',''].map(h=>el('th',{},h)))), tb) : el('div',{class:'empty'},'No scans yet.')));
}

/* ---------- scheduled jobs ---------- */
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function schedText(sc){
  const stop = sc.stop_at ? `, stops by ${sc.stop_at}` : '';
  if(sc.type==='once') return 'Once on '+sc.at.replace('T',' at ')+stop;
  if(sc.type==='daily') return `Every day at ${sc.time}${stop}`;
  return `${(sc.days||[]).map(d=>DAYS[d]).join(', ')} at ${sc.time}${stop}`;
}
function endEdit(){
  if(S.rootsBackup){ S.roots = S.rootsBackup; store.set('roots', S.roots); }
  S.editJob = null; S.rootsBackup = null; go('jobs');
}
function choose(title, msg, options){
  return new Promise(res => {
    const m = el('div',{class:'modal'}, el('div',{}, el('h2',{style:'margin-top:0'},title), el('p',{},msg),
      el('div',{class:'actions',style:'justify-content:flex-end'}, ...options.map(([val,label,cls]) => el('button',{class:'btn '+(cls||''),onclick:()=>{m.remove();res(val)}},label)))));
    document.body.append(m);
  });
}
function openJobModal(job, body){
  const sc = job ? job.schedule : {type:'daily', time:'02:00'};
  const t = new Date(Date.now()+86400000), pad = n => String(n).padStart(2,'0');
  const name = el('input',{type:'text',value:job?job.name:'',placeholder:'e.g. Nightly video check – home folders'});
  const type = el('select',{}, [['daily','Every day'],['weekly','On selected days'],['once','Just once']].map(([v,l])=>el('option',{value:v,selected:sc.type===v},l)));
  const time = el('input',{type:'time',value:sc.time||'02:00'});
  const at = el('input',{type:'datetime-local',value:sc.at||`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T02:00`});
  const dayBoxes = DAYS.map((d,i)=>el('input',{type:'checkbox',checked:(sc.days||[0,1,2,3,4,5,6]).includes(i)}));
  const daysRow = el('div',{style:'display:flex;gap:12px;flex-wrap:wrap;margin-top:6px'}, DAYS.map((d,i)=>el('label',{style:'display:flex;gap:4px;align-items:center;margin:0;color:var(--text)'}, dayBoxes[i], d)));
  const stopOn = el('input',{type:'checkbox',checked:!!sc.stop_at}); const stop = el('input',{type:'time',value:sc.stop_at||'06:00',style:'width:130px'});
  const keep = el('input',{type:'number',min:1,max:50,value:job?job.keep_runs:3,style:'width:90px'});
  const enabled = el('input',{type:'checkbox',checked:job?!!job.enabled:true});
  const sync = () => { const v=type.value; time.parentElement.classList.toggle('hide',v==='once'); at.parentElement.classList.toggle('hide',v!=='once'); daysRow.classList.toggle('hide',v!=='weekly'); stop.classList.toggle('hide',!stopOn.checked); };
  type.onchange = sync; stopOn.onchange = sync;
  const lab = (txt, ...kids) => el('div',{}, el('label',{},txt), ...kids);
  const m = el('div',{class:'modal'}, el('div',{},
    el('h2',{style:'margin-top:0'}, job ? 'Save scheduled job' : 'New scheduled job'),
    lab('Job name', name),
    lab('Repeat', type), daysRow,
    lab('Start time', time), lab('Date and time', at),
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--text);margin-top:12px'}, stopOn, 'Stop automatically at', stop),
    el('div',{class:'mute small'},'If it is still running at that time it stops, and what it has already read is cached so the next run carries on from there.'),
    lab('Keep results of the last … runs', keep),
    el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--text);margin-top:12px'}, enabled, 'Enabled'),
    el('p',{class:'mute small'}, `Times use the server clock (${S.cfg.tz}). ${body.family==='folders' ? (body.auto_remove ? 'This job deletes the empty folders it finds (rmdir, so nothing with files in it is touched).' : 'This job only lists empty folders for you to review.') : 'The job only finds duplicates for you to review. It never removes anything by itself.'}`),
    el('div',{class:'actions',style:'justify-content:flex-end'},
      el('button',{class:'btn',onclick:()=>m.remove()},'Cancel'),
      el('button',{class:'btn primary',onclick:async()=>{
        const sched = {type:type.value};
        if(sched.type==='once') sched.at = at.value; else sched.time = time.value;
        if(sched.type==='weekly') sched.days = dayBoxes.map((b,i)=>b.checked?i:-1).filter(i=>i>=0);
        if(stopOn.checked) sched.stop_at = stop.value;
        const payload = {name:name.value, params:body, schedule:sched, keep_runs:+keep.value, enabled:enabled.checked};
        try{
          if(job) await api('/api/jobs/'+job.id, payload, 'PUT'); else await api('/api/jobs', payload);
          m.remove(); toast('Job saved');
          if(S.rootsBackup){ S.roots = S.rootsBackup; store.set('roots', S.roots); }
          S.editJob = null; S.rootsBackup = null; go('jobs');
        }catch(e){ toast(e.message, 6000) }
      }},'Save job'))));
  document.body.append(m); sync();
}
async function viewJobs(){
  const d = await api('/api/jobs'); const m = $('#main');
  const tb = el('tbody');
  d.jobs.forEach(j => {
    const last = j.last, p = j.params;
    const lastCell = last ? el('td',{}, el('span',{class:'pill '+(last.status==='done'?'ok':last.status==='error'?'bad':'warn')}, last.status),
        el('span',{class:'sub'}, (last.finished?fmtDate(last.finished):'')+(last.status==='done'?(p.family==='folders'?` · ${last.stats.groups} empty folders`+(last.stats.removed?`, ${last.stats.removed} removed`:''):(p.family==='health'?` · ${last.stats.groups} suspect videos`:` · ${last.stats.groups} groups`)):'')),
        last.message ? el('span',{class:'sub',title:last.message}, last.message.slice(0,60)) : '',
        last.status==='done' ? el('button',{class:'btn sm',style:'margin-top:4px'+((p.family==='folders'&&p.auto_remove)?';opacity:.6':''),title:(p.family==='folders'&&p.auto_remove)?'Auto-delete job: the folders were already removed, so this list is normally empty':'',onclick:()=>{S.scanId=last.id;store.set('scanId',last.id);go('results')}},'Open results') : '')
      : el('td',{class:'mute'},'not run yet');
    tb.append(el('tr',{},
      el('td',{}, el('input',{type:'checkbox',checked:!!j.enabled,title:'Enable / pause this job',onchange:async e=>{ try{ await api('/api/jobs/'+j.id,{enabled:e.target.checked},'PUT'); viewJobs(); }catch(x){toast(x.message)} }})),
      el('td',{}, el('b',{},j.name), el('span',{class:'sub'}, methodLabel(p.family,p.mode)), (p.family==='folders' && p.auto_remove) ? el('span',{class:'pill warn',style:'margin-top:4px;display:inline-block',title:'This job deletes the empty folders it finds as soon as the scan finishes, so its results list is normally empty. The number removed is shown under Last run.'},'AUTO-DELETES') : ''),
      el('td',{style:'word-break:break-all'}, (p.roots||[]).map(r=>r.path+(r.protected?' (protected)':'')).join(', ')),
      el('td',{}, schedText(j.schedule), el('span',{class:'sub'}, j.enabled && j.next_run ? 'Next: '+fmtDate(j.next_run) : j.enabled ? 'Finished' : 'Paused')),
      lastCell,
      el('td',{}, String(j.keep_runs)),
      el('td',{}, el('div',{class:'actions'},
        el('button',{class:'btn sm',onclick:async()=>{ try{ await api('/api/jobs/'+j.id+'/run',{}); startPolling(); toast('Job started'); }catch(x){toast(x.message)} }},'Run now'),
        j.runs ? el('button',{class:'btn sm',title:'Delete the saved results of this job but keep the job and its schedule (no files are touched)',onclick:async()=>{ try{ const r = await api('/api/jobs/'+j.id+'?results=only',undefined,'DELETE'); toast('Cleared '+r.cleared+' saved result'+(r.cleared===1?'':'s')); viewJobs(); }catch(x){toast(x.message)} }},'Clear results') : '',
        el('button',{class:'btn sm',onclick:()=>{ S.rootsBackup=[...S.roots]; S.roots=(j.params.roots||[]).map(r=>({...r})); S.editJob=j; go('scan'); }},'Edit'),
        el('button',{class:'btn sm',onclick:async()=>{
          const c = await choose('Delete “'+j.name+'”?', 'The job stops running. Do you also want to delete the saved results from its previous runs? (No files are touched either way.)',
            [['no','Cancel'],['job','Delete job, keep results'],['all','Delete job and results','danger']]);
          if(c==='no') return;
          try{ await api('/api/jobs/'+j.id+(c==='all'?'?results=1':''),undefined,'DELETE'); viewJobs(); }catch(x){toast(x.message)}
        }},'Delete')))));
  });
  m.replaceChildren(el('div',{class:'card'}, el('h2',{},'Scheduled jobs'),
    el('p',{class:'mute small'}, `Jobs scan at the times you choose (server clock: ${S.cfg.tz}), at low priority so the NAS stays responsive. They only find duplicates; you review and clean up on the Results tab. The newest runs of each job are kept and older ones are removed automatically.`),
    el('div',{class:'toolbar'}, el('button',{class:'btn primary',onclick:()=>{ toast('Set up the scan below, then click “Save as scheduled job…”',6000); go('scan'); }},'+ New scheduled job')),
    d.jobs.length ? el('table',{}, el('thead',{},el('tr',{},...['On','Job','Folders','Schedule','Last run','Keep','' ].map(h=>el('th',{},h)))), tb)
      : el('div',{class:'empty'},'No scheduled jobs yet. On the Scan tab, set up a scan and choose “Save as scheduled job…”.')));
}

/* ---------- open a file ---------- */
async function copyText(txt){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); return true; } }catch(e){}
  const ta = el('textarea',{style:'position:fixed;opacity:0'}); ta.value = txt; document.body.append(ta); ta.select();
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
async function showEmpty(f){
  let i; try{ i = await api('/api/emptyinfo/'+f.id); }catch(e){ return toast('Could not look at that folder.'); }
  const m = el('div',{class:'modal',onclick:e=>{ if(e.target===m) m.remove(); }});
  const cp = (txt, label) => async () => { toast((await copyText(txt)) ? label+' copied' : 'Could not copy — select the text and press Ctrl+C'); };
  const kindIcon = {folder:'📁',file:'📄',link:'🔗',unreadable:'⚠'};
  const rows = i.entries.length ? i.entries.map(e => el('div',{style:'padding:3px 0;font-size:13px'}, (kindIcon[e.kind]||'')+' '+e.name, e.size!=null?el('span',{class:'mute'},'  '+fmtSize(e.size)):'', e.kind==='folder'?el('span',{class:'mute'},'  (folder)'):''))
    : [el('div',{class:'mute small'}, i.exists ? 'Nothing inside it.' : 'This folder no longer exists.')];
  m.append(el('div',{},
    el('h2',{style:'margin-top:0;word-break:break-all'}, i.name),
    el('label',{},'On the NAS'), el('div',{class:'mono'}, i.nas_path),
    el('label',{},'Windows network path (paste into File Explorer’s address bar)'), el('div',{class:'mono'}, i.unc),
    el('label',{},'What is inside it right now'),
    el('div',{style:'max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0 10px'}, ...rows, i.more?el('div',{class:'mute small'},'… and more'):''),
    el('div',{class:'actions'},
      el('button',{class:'btn primary',onclick:cp(i.unc,'Windows path')},'Copy Windows path'),
      el('a',{class:'btn',href:i.dsm_url,target:'_blank',rel:'noopener',title:'Opens DSM File Station at this folder'},'Open in File Station'),
      el('button',{class:'btn',onclick:cp(i.nas_path,'NAS path')},'Copy NAS path')),
    el('div',{class:'actions',style:'justify-content:flex-end;margin-top:10px'}, el('button',{class:'btn',onclick:()=>m.remove()},'Close'))));
  document.body.append(m);
}
async function showFile(f){
  let i; try{ i = await api('/api/fileinfo/'+f.id); }catch(e){ return toast('That file is no longer there — it may have been moved or deleted since the scan.', 6000); }
  const m = el('div',{class:'modal',onclick:e=>{ if(e.target===m) m.remove(); }});
  const cp = (txt, label) => async () => { toast((await copyText(txt)) ? label+' copied' : 'Could not copy — select the text and press Ctrl+C'); };
  m.append(el('div',{},
    el('h2',{style:'margin-top:0;word-break:break-all'}, i.name),
    el('div',{class:'mute small'}, fmtSize(i.size)+' · modified '+fmtDate(i.mtime)),
    el('label',{},'Windows network path (paste into File Explorer’s address bar to open it in its normal program)'), el('div',{class:'mono'}, i.unc),
    el('label',{},'On the NAS'), el('div',{class:'mono'}, i.nas_path),
    el('div',{class:'actions',style:'margin-top:6px'},
      i.viewable ? el('a',{class:'btn primary',href:'/api/raw/'+f.id,target:'_blank',rel:'noopener'},'Open in browser') : '',
      el('a',{class:'btn'+(i.viewable?'':' primary'),href:'/api/raw/'+f.id+'?dl=1'}, i.viewable?'Download':'Download / open'),
      el('button',{class:'btn',onclick:cp(i.unc,'Windows path')},'Copy Windows path'),
      el('button',{class:'btn',onclick:cp(i.unc_folder,'Folder path')},'Copy folder path'),
      el('button',{class:'btn',title:'Move this file to another folder on the server',onclick:()=>pickFolder('Move this file to…', async p => {
        try{ const r = await api('/api/files/'+f.id+'/move',{dest:p}); m.remove(); toast('Moved to '+r.target, 6000); if(S.refresh) S.refresh(); }
        catch(e){ toast(e.message, 7000) } })},'Move to folder…'),
      el('a',{class:'btn',href:i.dsm_url,target:'_blank',rel:'noopener',title:'Opens DSM File Station at this folder'},'Show folder in File Station')),
    i.viewable ? '' : el('p',{class:'mute small'},'Browsers cannot show this file type, so “Download / open” saves it to your PC — click it in your browser’s download list to open it with your own program.'),
    el('div',{class:'actions',style:'justify-content:flex-end;margin-top:10px'}, el('button',{class:'btn',onclick:()=>m.remove()},'Close'))));
  document.body.append(m);
}

/* ---------- boot ---------- */
(async function(){
  S.cfg = await api('/api/config');
  $('#ver').textContent = 'v' + S.cfg.version;
  document.title = 'ServerDedupe v' + S.cfg.version;
  renderNav();
  const {running} = await api('/api/status');
  if(running) startPolling();
  go(S.scanId ? 'results' : 'scan');
})();
